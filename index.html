function render(){document.body.className=s.theme==='light'?'light':'';document.querySelector('meta[name="theme-color"]').content=s.theme==='light'?'#e2edfa':'#0b101b';let t=stats(), good=t.pct!==null&&t.pct>=s.target, title={home:'Посещаемость',cal:'Календарь',schedule:'Расписание',settings:'Настройки'}[page];if(!$('nav').querySelector('button')){$('nav').innerHTML='<div class="nav-indicator" aria-hidden="true"></div>'+[['home','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>','Главная'],['cal','<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M7 3v4m10-4v4M3 10h18"/><path class="cal-line" style="--delay:90ms" d="M7 14h4"/><path class="cal-line" style="--delay:180ms" d="M13 14h4"/><path class="cal-line" style="--delay:270ms" d="M7 17h4"/><path class="cal-line" style="--delay:340ms" d="M13 17h4"/></svg>','Календарь'],['schedule','<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path class="schedule-line" style="--delay:50ms" d="M9 8h6"/><path class="schedule-line" style="--delay:160ms" d="M9 12h6"/><path class="schedule-line" style="--delay:270ms" d="M9 16h4"/></svg>','Расписание'],['settings','<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m10 3-1 3-3 1-3 3v4l3 1 1 3 3 3h4l1-3 3-1 3-3v-4l-3-1-1-3-3-3z"/></svg>','Настройки']].map(([p,i,l])=>`<button class="${p===page?'active':''}" onclick="setPage('${p}')"><span>${i}</span>${l}</button>`).join('');}const nav=$('nav'), tabs=[...nav.querySelectorAll('button')], idx=['home','cal','schedule','settings'].indexOf(page);nav.style.setProperty('--tab',idx);tabs.forEach((b,i)=>{b.classList.toggle('active',i===idx);if(i===idx)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});let html=`<header><div class="brand">Vexi</div><small>${fmt(today)}</small></header><h1>${title}</h1>`;if(page==='home'){html+=`<div class="card hero"><small>Текущая посещаемость</small><div class="ring" style="--p:${t.pct||0}%;${t.pct!==null&&!good?'--accent:#ff8585':''}"><div><strong>${t.pct===null?'—':t.pct.toFixed(1)+'%'}</strong><small>Минимум ${s.target}%</small></div></div><div class="status ${good?'good':'muted'}">${t.pct===null?'Отметь первые уроки':good?'Выше или на уровне нормы':'Ниже необходимого минимума'}</div><button class="primary full" onclick="choose(today);setPage('cal')">Отметить сегодня</button></div><div class="section-label">Твоя статистика</div><div class="grid">${metric(t.p,'Посещено','good')}${metric(t.a+t.e,'Пропущено','danger')}${metric(t.buffer,'Можно пропустить подряд')}${metric(t.u,'Не отмечено')}</div>${t.u?'<p class="muted note">Неотмеченные уроки пока не входят в процент. Заполни историю для точного прогноза.</p>':''}<div class="card"><h2>Прогноз</h2><div class="row"><small>Пропустить ещё уроков</small><input type="number" min="0" max="999" value="${sim}" onchange="sim=Math.max(0,Number(this.value)||0);render()"></div><div class="metric">${t.n+sim?(100*t.p/(t.n+sim)).toFixed(1)+'%':'—'}</div><small>Если остальные отметки не изменятся</small><div class="row"><span>До конца периода осталось</span><b>${t.f} ур.</b></div><div class="row"><span>Нужно посетить подряд до нормы</span><b>${t.recover} ур.</b></div></div>`}else if(page==='cal'){html+=calendar()+lessons()}else if(page==='schedule'){let d=selected;let start=mode==='week'?add(d,-(parse(d).getDay()+6)%7):month+'-01', length=mode==='week'?7:new Date(parse(start).getFullYear(),parse(start).getMonth()+1,0).getDate();html+=`<div class="card"><h2>Обычная неделя</h2><small>Изменения применяются ко всем дням без индивидуальной настройки. Проверь прошлые отметки после изменения.</small>${names.map((n,i)=>`<div class="row"><span>${n}</span><input type="number" min="0" max="30" value="${s.week[i]}" onchange="s.week[${i}]=Math.min(30,Math.max(0,Number(this.value)||0));save()"></div>`).join('')}<small>Всего ${s.week.reduce((a,b)=>a+b,0)} уроков в неделю</small></div><div class="card"><h2>Индивидуальное расписание</h2><div class="tabs"><button class="${mode==='week'?'on':''}" onclick="mode='week';render()">Неделя</button><button class="${mode==='month'?'on':''}" onclick="mode='month';render()">Месяц</button></div><div class="row"><button onclick="shift(-1)">‹</button><b>${fmt(start)}</b><button onclick="shift(1)">›</button></div>${Array.from({length},(_,i)=>{let d=add(start,i);return `<div class="row"><span>${parse(d).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'})}</span><input type="number" min="0" max="30" value="${count(d)}" onchange="override('${d}',this.value)"><button onclick="resetDay('${d}')">↺</button></div>`}).join('')}</div>`}else{html+=`<div class="card"><h2>Учебный период</h2><div class="row"><span>Начало</span><input type="date" value="${s.start}" onchange="if(this.value&&this.value<=s.end){s.start=this.value;save()}else render()"></div><div class="row"><span>Конец</span><input type="date" value="${s.end}" onchange="if(this.value&&this.value>=s.start){s.end=this.value;save()}else render()"></div><div class="row"><span>Минимум, %</span><input type="number" min="1" max="99" value="${s.target}" onchange="s.target=Math.max(1,Math.min(99,Number(this.value)||80));save()"></div><div class="row"><span>Исключать уважительные пропуски из расчёта</span><input type="checkbox" ${s.excused?'checked':''} onchange="s.excused=this.checked;save()"></div></div><div class="card"><h2>Внешний вид</h2><div class="row"><span>Тема</span><select onchange="s.theme=this.value;save()"><option value="dark" ${s.theme==='dark'?'selected':''}>Тёмная</option><option value="light" ${s.theme==='light'?'selected':''}>Светлая</option></select></div></div><div class="card"><h2>Звук и вибрация</h2><div class="row"><span>Звуки кнопок</span><input type="checkbox" ${s.sound?'checked':''} onchange="s.sound=this.checked;save()"></div><div class="row"><span>Виброотклик</span><input type="checkbox" ${s.haptics?'checked':''} onchange="s.haptics=this.checked;save()"></div><p class="muted note">${inTelegram?'Нативный виброотклик Telegram. Проверь кнопкой ниже.':'Для виброотклика на iPhone открой Vexi через Telegram Mini App.'}</p><button class="full" onclick="void 0">Проверить отклик</button></div><div class="card"><h2>Данные</h2><p class="muted note">Хранятся в браузере этого устройства. Экспортируй резервную копию перед очисткой Safari.</p><button onclick="backup()">Экспорт JSON</button> <button onclick="document.getElementById('import').click()">Импорт</button><input id="import" type="file" accept=".json" hidden onchange="restore(this)"></div>`}$('app').innerHTML=html}
function shift(n){if(mode==='week'){selected=add(selected,n*7);month=selected.slice(0,7)}else{let d=parse(month+'-01');d.setMonth(d.getMonth()+n);month=date(d).slice(0,7);selected=month+'-01'}render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='attend-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.week)||x.week.length!==7||!x.marks||!x.over||!/^\d{4}-\d{2}-\d{2}$/.test(x.start)||!/^\d{4}-\d{2}-\d{2}$/.test(x.end)||x.start>x.end)throw Error();s={...initial,...x};save()}catch{alert('Некорректная резервная копия')}}render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

let audioContext;
function feedback(button){
  const navButtons=[...document.querySelectorAll('nav button')];
  const index=navButtons.indexOf(button);
  const frequencies=[620,740,680,540];
  if(s.haptics){try{if(inTelegram && tg.isVersionAtLeast('6.1')){if(index>=0)tg.HapticFeedback.selectionChanged();else tg.HapticFeedback.impactOccurred('light');}else if(typeof navigator.vibrate==='function')navigator.vibrate(10);}catch{}}
  if(!s.sound)return;
  try{
    const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
    audioContext ||= new Audio();const ctx=audioContext;
    function play(){if(ctx.state!=='running')return;const t=ctx.currentTime;
      const tone=ctx.createOscillator(),gain=ctx.createGain();tone.type='sine';
      const f=frequencies[index]||820;tone.frequency.setValueAtTime(f,t);tone.frequency.exponentialRampToValueAtTime(f*.58,t+.055);
      gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.12,t+.004);gain.gain.exponentialRampToValueAtTime(.0001,t+.075);
      tone.connect(gain);gain.connect(ctx.destination);tone.start(t);tone.stop(t+.08);tone.onended=()=>{tone.disconnect();gain.disconnect()};
    }
    if(ctx.state==='running')play();else ctx.resume().then(play).catch(()=>{});
  }catch{}
}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(button&&!button.disabled&&event.isTrusted)feedback(button)},true);
document.addEventListener('change',event=>{if(event.isTrusted&&event.target.matches('input[type="checkbox"],select,input[type="date"]'))feedback(event.target)},true);
</script></html>
