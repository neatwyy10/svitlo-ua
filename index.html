</style></head><body><main id="app"></main><nav id="nav" aria-label="Навигация"></nav><script>

const date=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,parse=d=>new Date(d+'T12:00:00'),add=(d,n)=>{const x=parse(d);x.setDate(x.getDate()+n);return date(x)},today=date(new Date()),fmt=d=>parse(d).toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'}),wd=d=>(parse(d).getDay()+6)%7, names=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'],clamp=(v,a,b)=>Math.min(b,Math.max(a,Math.trunc(Number(v)||0))),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults={week:[4,4,2,4,4,0,0],over:{},marks:{},start:today,end:date(new Date(new Date().getFullYear()+1,5,30)),target:80,theme:'dark',excused:false,sound:true,haptics:true};
function normalize(x){const s={...defaults,...x};if(!Array.isArray(s.week)||s.week.length!==7)throw Error('week');s.week=s.week.map(v=>clamp(v,0,30));for(const k of ['start','end'])if(!/^\d{4}-\d{2}-\d{2}$/.test(s[k])||!Number.isFinite(+parse(s[k])))throw Error(k);if(s.start>s.end||+parse(s.end)-+parse(s.start)>3660*864e5)throw Error('period');s.target=clamp(s.target,1,99);s.over=Object.fromEntries(Object.entries(s.over||{}).filter(([k])=>/^\d{4}-\d{2}-\d{2}$/.test(k)).map(([k,v])=>[k,clamp(v,0,30)]));s.marks=Object.fromEntries(Object.entries(s.marks||{}).filter(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Array.isArray(v)).map(([k,v])=>[k,v.slice(0,30).map(m=>['p','a','e'].includes(m)?m:'')]));return s}
let s;try{s=normalize(JSON.parse(localStorage.getItem('attend-v1')||'{}'))}catch{s=normalize({})}let page='home',selected=today,month=today.slice(0,7),mode='week',sim=0;
function save(){try{localStorage.setItem('attend-v1',JSON.stringify(s))}catch(e){alert('Не удалось сохранить данные')}render()}
const count=d=>s.over[d]??s.week[wd(d)],marks=d=>Array.from({length:count(d)},(_,i)=>s.marks[d]?.[i]||'');
function stats(){let p=0,a=0,e=0,u=0,f=0;for(let d=s.start;d<=s.end;d=add(d,1)){if(d>today){f+=count(d);continue}for(const m of marks(d)){if(m==='p')p++;else if(m==='a')a++;else if(m==='e')e++;else u++}}const n=p+a+(s.excused?0:e),q=s.target/100;return {p,a,e,u,f,n,pct:n?p/n*100:null,buffer:Math.max(0,Math.floor(p/q-n+1e-8)),recover:Math.max(0,Math.ceil((q*n-p)/(1-q)-1e-8))}}

function haptic(kind='tap'){if(!s.haptics&&kind!=='test')return 'Выключено в настройках';const t=tg();try{if(t?.HapticFeedback&&t.platform!=='unknown'){if(kind==='test')t.HapticFeedback.notificationOccurred('success');else if(kind==='select')t.HapticFeedback.selectionChanged();else t.HapticFeedback.impactOccurred('light');return 'Команда отправлена Telegram (физический отклик не подтверждается API)'}if(typeof navigator.vibrate==='function'){return navigator.vibrate(kind==='test'?60:12)?'Команда отправлена браузеру':'Браузер отклонил команду'}return 'Нет нативного интерфейса Telegram или Vibration API'}catch(e){return 'Ошибка: '+e.message}}

document.addEventListener('click',e=>{const b=e.target.closest('button,input[type=checkbox]');if(!b||b.disabled)return;const k=b.id==='test'?'test':b.closest('nav')?'select':'tap';const result=haptic(k);sound(k);if(k==='test')$('result').textContent=result},{capture:true});
const icons={home:'<path d="m3 10 9-7 9 7v10h-6v-7H9v7H3z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="4"/><path d="M7 3v4m10-4v4M3 10h18"/><path class="draw" style="--delay:80ms" d="M7 14h4"/><path class="draw" style="--delay:180ms" d="M13 14h4"/><path class="draw" style="--delay:260ms" d="M7 17h10"/>',schedule:'<rect x="5" y="3" width="14" height="18" rx="3"/><path class="draw" style="--delay:40ms" d="M9 8h6"/><path class="draw" style="--delay:130ms" d="M9 12h6"/><path class="draw" style="--delay:230ms" d="M9 16h4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m10 3-1 3-3 1-3 3v4l3 1 1 3 3 3h4l1-3 3-1 3-3v-4l-3-1-1-3-3-3z"/>'};const labels={home:'Главная',cal:'Календарь',schedule:'Расписание',settings:'Настройки'};
$('nav').innerHTML='<div class="pill"></div>'+Object.keys(labels).map(k=>`<button data-page="${k}"><svg viewBox="0 0 24 24">${icons[k]}</svg>${labels[k]}</button>`).join('');$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;page=b.dataset.page;render();b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');window.scrollTo(0,0)});
const card=(h,body)=>`<section class="card"><h2>${h}</h2>${body}</section>`,row=(l,r)=>`<div class="row"><span>${l}</span>${r}</div>`,btn=(label,action,cls='')=>`<button class="${cls}" data-action="${action}">${label}</button>`,num=(v,field)=>`<input type="number" min="0" max="30" value="${v}" data-field="${field}">`,check=(v,k)=>`<input type="checkbox" ${v?'checked':''} data-field="${k}">`,metric=(v,l,c='')=>`<div class="card"><small>${l}</small><div class="metric ${c}">${v}</div></div>`;
function render(){document.body.classList.toggle('light',s.theme==='light');const keys=Object.keys(labels);$('nav').style.setProperty('--tab',keys.indexOf(page));$('nav').querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const t=stats(),good=t.pct!==null&&t.pct>=s.target;let html=`<header><span class="brand">vexi.</span><small>${fmt(today)}</small></header><h1>${page==='home'?'Посещаемость':labels[page]}</h1>`;
if(page==='home'){html+=`<section class="card hero"><small>Текущая посещаемость</small><div class="ring" style="--p:${t.pct||0}%;--ring:${t.pct===null?'var(--blue)':good?'var(--green)':'var(--red)'}"><div><strong>${t.pct===null?'—':t.pct.toFixed(1)+'%'}</strong><small>Минимум ${s.target}%</small></div></div><span>${t.pct===null?'Отметь первые уроки':good?'В пределах нормы':'Ниже нормы'}</span>${btn('Отметить сегодня','today','primary')}</section><div class="grid">${metric(t.p,'Посещено','green')}${metric(t.a+t.e,'Пропущено','red')}${metric(t.buffer,'Можно пропустить подряд')}${metric(t.u,'Не отмечено')}</div><p class="muted">Неотмеченные уроки не входят в процент.</p>`+card('Прогноз',row('Пропустить ещё уроков',`<input type="number" min="0" max="9999" value="${sim}" data-field="sim">`)+`<div class="metric">${t.n+sim?(100*t.p/(t.n+sim)).toFixed(1)+'%':'—'}</div>`+row('Будущих уроков',`<b>${t.f}</b>`)+row('Посетить подряд до нормы',`<b>${t.recover}</b>`));}
if(page==='cal'){const first=month+'-01',len=new Date(parse(first).getFullYear(),parse(first).getMonth()+1,0).getDate();html+=card('Календарь',row(btn('‹','prev'),`<b>${parse(first).toLocaleDateString('ru',{month:'long',year:'numeric'})}</b>${btn('›','next')}`)+`<div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<small>${x}</small>`).join('')}${'<span></span>'.repeat(wd(first))}${Array.from({length:len},(_,i)=>{const d=add(first,i),m=marks(d),p=m.includes('p'),a=m.some(x=>x==='a'||x==='e');return btn(`${i+1}<small>${count(d)} ур.</small>`,'day:'+d,`day ${d===selected?'sel':''} ${p&&a?'m':a?'a':p?'p':''}`)}).join('')}</div>`)+card(fmt(selected),row('Уроков',num(count(selected),'over:'+selected))+(s.over[selected]!==undefined?btn('Вернуть расписание','reset:'+selected):'')+(selected>today?'<p class="muted">Будущий день</p>':`<div class="tabs">${btn('Все был','all:p')}${btn('Все нет','all:a')}${btn('Сбросить','all:')}</div>`+marks(selected).map((m,i)=>row(`${i+1} урок`, `<div>${[['p','Был','on'],['a','Нет','bad'],['e','Уваж.','exc']].map(([v,l,c])=>btn(l,'mark:'+i+':'+v,m===v?c:'')).join(' ')}</div>`)).join('')));}
if(page==='schedule'){const start=mode==='week'?add(selected,-wd(selected)):month+'-01',len=mode==='week'?7:new Date(parse(start).getFullYear(),parse(start).getMonth()+1,0).getDate();html+=card('Обычная неделя',names.map((n,i)=>row(n,num(s.week[i],'week:'+i))).join('')+`<p class="muted">${s.week.reduce((a,b)=>a+b,0)} уроков в неделю. Изменения затрагивают дни без индивидуальной настройки.</p>`)+card('Индивидуальное расписание',`<div class="tabs">${btn('Неделя','mode:week',mode==='week'?'on':'')}${btn('Месяц','mode:month',mode==='month'?'on':'')}</div>`+row(btn('‹','prev'),`<b>${fmt(start)}</b>${btn('›','next')}`)+Array.from({length:len},(_,i)=>{const d=add(start,i);return row(parse(d).toLocaleDateString('ru',{weekday:'short',day:'numeric',month:'short'}),`<div>${num(count(d),'over:'+d)} ${btn('↺','reset:'+d)}</div>`)}).join(''));}

$('app').innerHTML=html;}
$('app').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const [k,v,w]=b.dataset.action.split(':');if(k==='today'){selected=today;month=today.slice(0,7);page='cal'}else if(k==='day'){selected=v;month=v.slice(0,7)}else if(k==='mark'){s.marks[selected]??=[];s.marks[selected][+v]=s.marks[selected][+v]===w?'':w;return save()}else if(k==='all'){s.marks[selected]=Array(count(selected)).fill(v);return save()}else if(k==='reset'){delete s.over[v];return save()}else if(k==='mode'){mode=v}else if(k==='prev'||k==='next'){const n=k==='prev'?-1:1;if(page==='schedule'&&mode==='week'){selected=add(selected,n*7);month=selected.slice(0,7)}else{const d=parse(month+'-01');d.setMonth(d.getMonth()+n);month=date(d).slice(0,7);selected=month+'-01'}}else if(k==='export'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.href=url;a.download='vexi-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}else if(k==='import'){$('file').click();return}render()});

</script></body></html>
